name: Update JS

on:
  workflow_dispatch:
  # At 4:20 AM UTC, on day 1 of the month, only in March and September
  schedule:
    - cron: '20 4 1 3,9 *'

permissions: {}

jobs:
  update-js:
    name: Update JS
    # Only run cron on the tractorcow-farm or silverstripe account
    if: (github.event_name == 'schedule' && (github.repository_owner == 'tractorcow-farm' || github.repository_owner == 'silverstripe')) || (github.event_name != 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Update JS
        uses: silverstripe/gha-update-js@v1
