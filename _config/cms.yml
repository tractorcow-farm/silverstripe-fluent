    FluentLeftAndMainExtension: TractorCow\Fluent\Extension\FluentLeftAndMainExtension

SilverStripe\CMS\Controllers\CMSMain:
  extensions:
    FluentLeftAndMainExtension: TractorCow\Fluent\Extension\FluentCMSMainExtension

